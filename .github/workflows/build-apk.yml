name: Build APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android

      - name: Create .env file
        run: echo "GEMINI_API_KEY=placeholder" > .env

      - name: Build Debug APK (with error capture)
        id: build
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build_output.txt
        continue-on-error: true

      - name: Show Kotlin compiler errors
        if: always()
        run: |
          echo "====== KOTLIN/JAVA ERRORS ======"
          grep -nE "^e:|error:|^w:|warning:|Unresolved reference|overload resolution|None of the|type mismatch|expecting" \
            /tmp/build_output.txt | head -60 || echo "(no matched lines)"
          echo ""
          echo "====== CAUSED BY / EXCEPTION ======"
          grep -A2 "Caused by:\|Exception in thread\|IllegalStateException\|ClassNotFoundException\|NoClassDefFoundError" \
            /tmp/build_output.txt | head -40 || echo "(none)"
          echo ""
          echo "====== BUILD RESULT ======"
          grep -E "BUILD (FAILED|SUCCESSFUL)|FAILURE:|error:" /tmp/build_output.txt | tail -10

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload Debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FontNova-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
